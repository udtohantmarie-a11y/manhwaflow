<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#111422"/>
      <stop offset="100%" stop-color="#181d33"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="900" fill="url(#bgGrad)"/>
  <rect width="600" height="900" fill="url(#grid)"/>

  <!-- Ambient Glow -->
  <circle cx="300" cy="380" r="280" fill="url(#glow)"/>

  <!-- Decorative Inner Border -->
  <rect x="24" y="24" width="552" height="852" rx="20" fill="none" stroke="rgba(139, 92, 246, 0.25)" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Center Artwork / Logo Badge -->
  <g transform="translate(300, 370)">
    <!-- Outer Ring -->
    <circle r="72" fill="none" stroke="rgba(139, 92, 246, 0.4)" stroke-width="2"/>
    <circle r="60" fill="url(#brandGrad)" filter="drop-shadow(0px 10px 20px rgba(124, 58, 237, 0.5))"/>

    <!-- MF Monogram -->
    <text x="0" y="16" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2">MF</text>
  </g>

  <!-- Floating Sparkles -->
  <g fill="#a78bfa" opacity="0.6">
    <circle cx="210" cy="270" r="3"/>
    <circle cx="390" cy="290" r="4"/>
    <circle cx="230" cy="480" r="3.5"/>
    <circle cx="370" cy="460" r="2.5"/>
  </g>

  <!-- Title & Branding -->
  <text x="300" y="520" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    Manhwa<tspan fill="#8b5cf6">Flow</tspan>
  </text>

  <rect x="230" y="540" width="140" height="24" rx="12" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1"/>
  <text x="300" y="556" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#c4b5fd" text-anchor="middle" letter-spacing="2">
    DIGITAL COMIC
  </text>

  <!-- Subtle bottom tag -->
  <text x="300" y="830" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle" letter-spacing="1">
    manhwaflow.site.je
  </text>
</svg>
