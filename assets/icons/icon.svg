<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Header Gradient: Diagonal bottom-left to top-right -->
    <linearGradient id="headerGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="boxShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4c1d95" flood-opacity="0.45" />
    </filter>

    <!-- Text Gradient: Pure Ice White -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Box (Matching Header rounded-xl border border-brand-400/30) -->
  <rect x="28" y="28" width="456" height="456" rx="112" 
        fill="url(#headerGrad)" 
        filter="url(#boxShadow)" 
        stroke="#c084fc" 
        stroke-width="8" 
        stroke-opacity="0.35" />

  <!-- MF Monogram Text (Bold, modern geometric typography) -->
  <text x="256" y="338" 
        font-family="'Segoe UI', 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" 
        font-size="240" 
        font-weight="900" 
        letter-spacing="-14"
        fill="url(#textGrad)" 
        text-anchor="middle">
    MF
  </text>
</svg>
